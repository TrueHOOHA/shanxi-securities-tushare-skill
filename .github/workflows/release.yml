name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release tag
        id: tag
        run: |
          DATE=$(date -u +%Y.%m.%d)
          SHA=$(git rev-parse --short HEAD)
          # Append timestamp so multiple runs on the same commit stay unique
          TS=$(date -u +%H%M%S)
          echo "tag=v${DATE}-${SHA}-${TS}" >> "$GITHUB_OUTPUT"
          echo "name=Release ${DATE} ${SHA} (${TS} UTC)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          draft: false
          prerelease: false
